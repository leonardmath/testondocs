# Código para extrair dados dos tanques
code: |
  def extrair_tanques():
    """Extrai dados dos tanques para API"""
    if not defined('tanques'):
      return []
      
    lista_tanques = []
    for tanque in tanques:
      dados_tanque = {
        'numero': tanque.numero if defined('tanque.numero') else None,
        'tipo': tanque.tipo if defined('tanque.tipo') else None,
        'eh_tripartido': tanque.eh_tripartido if defined('tanque.eh_tripartido') else False,
        'combustivel': tanque.combustivel if defined('tanque.combustivel') else None,
        'capacidade': tanque.capacidade if defined('tanque.capacidade') else None,
        'material': tanque.material if defined('tanque.material') else None,
        'parede_dupla': tanque.parede_dupla if defined('tanque.parede_dupla') else None,
        'jaquetado': tanque.jaquetado if defined('tanque.jaquetado') else None,
        'monit_intersticial': tanque.monit_intersticial if defined('tanque.monit_intersticial') else None,
        'monit_tipo': tanque.monit_tipo if defined('tanque.monit_tipo') else None,
        'ano_fabricacao': tanque.ano_fabricacao if defined('tanque.ano_fabricacao') else None,
        'ano_instalacao': tanque.ano_instalacao if defined('tanque.ano_instalacao') else None,
        'localizacao': tanque.localizacao if defined('tanque.localizacao') else None,
        'situacao': tanque.situacao if defined('tanque.situacao') else None,
        'tem_cruzeta': tanque.tem_cruzeta if defined('tanque.tem_cruzeta') else None,
        'tem_spill': tanque.tem_spill if defined('tanque.tem_spill') else None,
        'tem_respiro': tanque.tem_respiro if defined('tanque.tem_respiro') else None,
        'tem_antitransbordamento': tanque.tem_antitransbordamento if defined('tanque.tem_antitransbordamento') else None
      }
      
      # Se for tripartido, adicionar dados dos compartimentos
      if dados_tanque['eh_tripartido']:
        dados_tanque['compartimentos'] = [
          {
            'numero': 1,
            'combustivel': tanque.comb_comp1 if defined('tanque.comb_comp1') else None,
            'volume': tanque.vol_comp1 if defined('tanque.vol_comp1') else None
          },
          {
            'numero': 2,
            'combustivel': tanque.comb_comp2 if defined('tanque.comb_comp2') else None,
            'volume': tanque.vol_comp2 if defined('tanque.vol_comp2') else None
          },
          {
            'numero': 3,
            'combustivel': tanque.comb_comp3 if defined('tanque.comb_comp3') else None,
            'volume': tanque.vol_comp3 if defined('tanque.vol_comp3') else None
          }
        ]
        dados_tanque['capacidade'] = tanque.capacidade_total if defined('tanque.capacidade_total') else None
      
      # Calcular idade e vida útil
      if dados_tanque['ano_instalacao']:
        from datetime import datetime
        dados_tanque['anos_uso'] = datetime.now().year - dados_tanque['ano_instalacao']
        
        # Estimar vida útil baseado no tipo
        if dados_tanque['parede_dupla'] or dados_tanque['jaquetado']:
          vida_util_estimada = 20
        else:
          vida_util_estimada = 15
          
        dados_tanque['vida_util_estimada'] = vida_util_estimada
        dados_tanque['vida_util_restante'] = max(0, vida_util_estimada - dados_tanque['anos_uso'])
        dados_tanque['percentual_vida_util'] = round((dados_tanque['anos_uso'] / vida_util_estimada) * 100, 1)
      
      lista_tanques.append(dados_tanque)
    
    return lista_tanques
