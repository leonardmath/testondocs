# Código para extrair dados do bloco
code: |
  def extrair_historico():
    """Extrai histórico para envio à API"""
    dados = {
      'ano_inicio': historico.ano_inicio if defined('historico.ano_inicio') else None,
      'atividade_inicial': historico.atividade_inicial if defined('historico.atividade_inicial') else None,
      'teve_reformas': historico.teve_reformas if defined('historico.teve_reformas') else None,
      'descricao_reformas': historico.descricao_reformas if defined('historico.descricao_reformas') else None,
      'substituiu_tanques': historico.substituiu_tanques if defined('historico.substituiu_tanques') else None,
      'tanques_substituicoes': historico.tanques_substituicoes if defined('historico.tanques_substituicoes') else None,
      'bandeira_original': historico.bandeira_original if defined('historico.bandeira_original') else None,
      'bandeira_original_ano': historico.bandeira_original_ano if defined('historico.bandeira_original_ano') else None,
      'mudou_bandeira': historico.mudou_bandeira if defined('historico.mudou_bandeira') else None,
      'bandeira_atual': historico.bandeira_atual if defined('historico.bandeira_atual') else None,
      'bandeira_mudanca_ano': historico.bandeira_mudanca_ano if defined('historico.bandeira_mudanca_ano') else None,
      'teve_incidentes': historico.teve_incidentes if defined('historico.teve_incidentes') else None,
      'descricao_incidentes': historico.descricao_incidentes if defined('historico.descricao_incidentes') else None,
      'teve_autuacoes': historico.teve_autuacoes if defined('historico.teve_autuacoes') else None,
      'descricao_autuacoes': historico.descricao_autuacoes if defined('historico.descricao_autuacoes') else None,
      'layout_modificado': historico.layout_modificado if defined('historico.layout_modificado') else None,
      'layout_descricao': historico.layout_descricao if defined('historico.layout_descricao') else None
    }
    
    # Calcular tempo de operação
    if dados['ano_inicio']:
      from datetime import datetime
      dados['anos_operacao'] = datetime.now().year - dados['ano_inicio']
    
    return dados
