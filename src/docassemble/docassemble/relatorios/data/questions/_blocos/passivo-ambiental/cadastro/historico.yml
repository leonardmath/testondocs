# =============================================================================
# 🧱 BLOCO: HISTÓRICO DA ÁREA
# =============================================================================
# Coleta informações sobre o histórico de operação do empreendimento
# Usado em: Passivo Ambiental
# =============================================================================

id: historico
question: |
  📜 Histórico da Área
subquestion: |
  Informe o histórico de operação do empreendimento.
  
  <div class="alert alert-info">
    💡 **Importante:** Estas informações são essenciais para o relatório de passivo ambiental.
  </div>

fields:
  - note: |
      #### 🏁 Início das Atividades
      
  - "Ano de início das atividades": historico.ano_inicio
    datatype: integer
    required: False
    min: 1900
    max: 2025
    hint: "Ex: 1971"
    
  - "Atividade inicial": historico.atividade_inicial
    datatype: area
    required: False
    hint: "Descreva a atividade inicial do empreendimento"
    
  - note: |
      ---
      #### 🔄 Reformas e Modernizações
      
  - "Houve reformas ou modernizações?": historico.teve_reformas
    datatype: yesnoradio
    required: False
    
  - "Descreva as principais reformas": historico.descricao_reformas
    datatype: area
    required: False
    show if: historico.teve_reformas
    rows: 6
    hint: "Descreva ano, tipo de reforma e principais alterações"
    
  - note: |
      ---
      #### 🛢️ Histórico de Tanques
      
  - "Houve substituição de tanques?": historico.substituiu_tanques
    datatype: yesnoradio
    required: False
    
  - "Descrição das substituições de tanques": historico.tanques_substituicoes
    datatype: area
    required: False
    show if: historico.substituiu_tanques
    rows: 4
    hint: "Ano, tipo de tanque antigo, tipo de tanque novo, motivo"
    
  - note: |
      ---
      #### 🏷️ Histórico de Bandeiras
      
  - "Bandeira original": historico.bandeira_original
    required: False
    code: lista_bandeiras
    
  - "Ano da bandeira original": historico.bandeira_original_ano
    datatype: integer
    required: False
    show if: historico.bandeira_original
    min: 1900
    max: 2025
    
  - "Houve mudança de bandeira?": historico.mudou_bandeira
    datatype: yesnoradio
    required: False
    
  - "Bandeira atual": historico.bandeira_atual
    required: False
    show if: historico.mudou_bandeira
    code: lista_bandeiras
    
  - "Ano da mudança de bandeira": historico.bandeira_mudanca_ano
    datatype: integer
    required: False
    show if: historico.mudou_bandeira
    min: 1900
    max: 2025
    
  - note: |
      ---
      #### ⚠️ Histórico de Incidentes
      
  - "Houve vazamentos ou incidentes ambientais?": historico.teve_incidentes
    datatype: yesnoradio
    required: False
    
  - "Descrição dos incidentes": historico.descricao_incidentes
    datatype: area
    required: False
    show if: historico.teve_incidentes
    rows: 4
    hint: "Data, tipo de incidente, ações tomadas"
    
  - "Houve autuações ambientais?": historico.teve_autuacoes
    datatype: yesnoradio
    required: False
    
  - "Descrição das autuações": historico.descricao_autuacoes
    datatype: area
    required: False
    show if: historico.teve_autuacoes
    rows: 3
    
  - note: |
      ---
      #### 🏗️ Layout Físico
      
  - "O layout físico foi modificado ao longo do tempo?": historico.layout_modificado
    datatype: yesnoradio
    required: False
    
  - "Descreva as modificações no layout": historico.layout_descricao
    datatype: area
    required: False
    show if: historico.layout_modificado
    rows: 3

section: cadastro
continue button field: historico_preenchido
