  css:
    - docassemble.relatorios:data/static/css/status.css

---
# =============================================================================
# FUNÇÕES UTILITÁRIAS GLOBAIS
# Disponíveis em todos os blocos da entrevista
# =============================================================================
code: |
  import re

  def limpar_cnpj(cnpj):
      """Remove formatação do CNPJ, retorna apenas dígitos."""
      if not cnpj:
          return ''
      return re.sub(r'\D', '', str(cnpj))

  def formatar_cnpj(cnpj):
      """Formata CNPJ: XX.XXX.XXX/XXXX-XX"""
      c = limpar_cnpj(cnpj)
      if len(c) == 14:
          return f"{c[0:2]}.{c[2:5]}.{c[5:8]}/{c[8:12]}-{c[12:14]}"
      return cnpj

  def limpar_cep(cep):
      """Remove formatação do CEP, retorna apenas dígitos."""
      if not cep:
          return ''
      return re.sub(r'\D', '', str(cep))

  def formatar_cep(cep):
      """Formata CEP: XXXXX-XXX"""
      c = limpar_cep(cep)
      if len(c) == 8:
          return f"{c[0:5]}-{c[5:8]}"
      return cep

  def limpar_telefone(tel):
      """Remove formatação de telefone."""
      if not tel:
          return ''
      return re.sub(r'\D', '', str(tel))

  def valor_ou_nao_informado(valor):
      """Retorna valor ou 'Não informado' se vazio."""
      if valor is None or str(valor).strip() == '':
          return 'Não informado'
      return str(valor)
---
