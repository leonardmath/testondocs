code: |
  # Processar e consolidar dados
  def formatar_dados_objeto(obj):
      if not obj or not hasattr(obj, '__dict__'):
          return {}
      
      dados_formatados = {}
      for attr_name in dir(obj):
          if not attr_name.startswith('_') and not callable(getattr(obj, attr_name)):
              try:
                  valor = getattr(obj, attr_name)
                  if valor is None:
                      dados_formatados[attr_name] = "Não informado"
                  elif isinstance(valor, bool):
                      dados_formatados[attr_name] = "Sim" if valor else "Não"
                  elif isinstance(valor, (list, DAList)):
                      if len(valor) > 0:
                          dados_formatados[attr_name] = ", ".join([str(v) for v in valor])
                      else:
                          dados_formatados[attr_name] = "Nenhum"
                  else:
                      dados_formatados[attr_name] = str(valor)
              except:
                  pass
      return dados_formatados
  
  dados_consolidados = {
      "metadata": {
          "protocolo": protocolo,
          "timestamp": inicio_entrevista.isoformat(),
          "data_formatada": inicio_entrevista.strftime('%d/%m/%Y %H:%M:%S'),
          "versao": "5.1.4",
          "modo": "visualizacao"
      },
      "cadastro": {
          "empresa": formatar_dados_objeto(dados_cadastrais),
          "endereco": formatar_dados_objeto(endereco),
          "contato": formatar_dados_objeto(contato),
          "localizacao": formatar_dados_objeto(localizacao)
      },
      "historico": formatar_dados_objeto(historico),
      "entorno": formatar_dados_objeto(entorno),
      "infraestrutura": {
          "empreendimento": formatar_dados_objeto(empreendimento),
          "bombas": formatar_dados_objeto(bombas),
          "servicos": formatar_dados_objeto(servicos),
          "monitoramento": formatar_dados_objeto(monitoramento)
      },
      "investigacao": {
          "vistoria": {
              "responsavel": formatar_dados_objeto(vistoria),
              "sistemas_seguranca_pistas": formatar_dados_objeto(sistemas_seguranca_pistas),
              "sistemas_seguranca_controles": formatar_dados_objeto(sistemas_seguranca_controles),
              "sistemas_tratamento": formatar_dados_objeto(sistemas_tratamento),
              "infra_sanitaria": formatar_dados_objeto(infra_sanitaria),
              "residuos": formatar_dados_objeto(residuos),
              "lavagem": formatar_dados_objeto(lavagem)
          },
          "mci": formatar_dados_objeto(mci) if defined('mci') else {},
          "sondagens": [
              formatar_dados_objeto(s) for s in sondagens
          ] if defined('sondagens') and sondagens.number() > 0 else []
      },
      "anexos": {
          "quantidade": anexos.number() if defined('anexos') else 0
      }
  }
  
  dados_json = json.dumps(dados_consolidados, ensure_ascii=False, indent=2)
  
  processar_coleta = True
