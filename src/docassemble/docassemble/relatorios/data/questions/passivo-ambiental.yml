code: |
  from datetime import datetime
  import random
  import json

  if not defined('fluxo_iniciado'):
      def gerar_protocolo(prefixo):
          ts = datetime.now().strftime("%Y%m%d%H%M%S")
          rnd = random.randint(1000, 9999)
          return f"{prefixo}{ts}{rnd}"

      protocolo = gerar_protocolo("PAV")
      inicio_entrevista = datetime.now()
      fluxo_iniciado = True
      modo_visualizacao = True
